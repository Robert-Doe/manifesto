<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>NeuralTab — Network Monitor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Source+Code+Pro&display=swap');
    :root{--bg:#0b0f1a;--bg2:#0f1623;--card:#141c2e;--card2:#1a2540;--border:#1e3a5f;--gold:#f5c842;--cyan:#38bdf8;--purple:#a78bfa;--green:#4ade80;--red:#f87171;--orange:#fb923c;--text:#e2e8f0;--muted:#7a9bbf;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;}
    .top-bar{background:var(--bg2);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;padding:0 20px;justify-content:space-between;flex-shrink:0;}
    .brand{display:flex;align-items:center;gap:8px;}
    .bolt{color:var(--gold);font-size:20px;}
    .brand-name{font-weight:900;font-size:16px;color:var(--gold);}
    .page-name{font-size:13px;color:var(--muted);}
    .top-actions{display:flex;gap:8px;}
    .btn{border:none;cursor:pointer;border-radius:6px;font-family:'Lato',sans-serif;font-weight:700;font-size:13px;padding:7px 14px;transition:opacity 0.15s;}
    .btn:hover{opacity:0.85;}
    .btn-gold{background:var(--gold);color:#000;}
    .btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
    .btn-danger{background:#3a1010;color:var(--red);border:1px solid var(--red);}
    .body{flex:1;display:flex;overflow:hidden;}
    .sidebar{width:260px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
    .s-num{font-size:28px;font-weight:900;color:var(--red);}
    .s-label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px;}
    .rule-list{display:flex;flex-direction:column;gap:6px;}
    .rule-item{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
    .r-action{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
    .r-block{color:var(--red);}
    .r-redirect{color:var(--orange);}
    .r-headers{color:var(--cyan);}
    .r-filter{font-size:12px;font-family:'Source Code Pro',monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);}
    .toggle{position:relative;width:36px;height:20px;}
    .toggle input{opacity:0;width:0;height:0;}
    .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--card2);border-radius:20px;cursor:pointer;transition:0.2s;}
    .toggle input:checked + .slider{background:var(--green);}
    .slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:0.2s;}
    .toggle input:checked + .slider:before{transform:translateX(16px);}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .filter-bar{padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;}
    #filter-type{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Lato',sans-serif;font-size:13px;padding:5px 8px;}
    .event-log{flex:1;overflow-y:auto;padding:8px;}
    .event-row{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;border-radius:6px;margin-bottom:4px;font-family:'Source Code Pro',monospace;font-size:12px;border:1px solid transparent;}
    .event-row:hover{background:var(--card);border-color:var(--border);}
    .ev-time{color:var(--muted);min-width:70px;flex-shrink:0;}
    .ev-type{min-width:80px;flex-shrink:0;font-weight:700;}
    .ev-url{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .type-beforenavigate{color:var(--cyan);}
    .type-completed{color:var(--green);}
    .type-blocked{color:var(--red);}
    .type-errored{color:var(--red);font-style:italic;}
    .empty-state{text-align:center;padding:60px;color:var(--muted);}
    .section-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand"><span class="bolt">⚡</span><span class="brand-name">NeuralTab</span><span class="page-name" style="margin-left:8px;">Network Monitor</span></div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="btn-clear">Clear</button>
      <button class="btn btn-ghost" id="btn-reload-rules">Reload Rules</button>
    </div>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="stat-card"><div class="s-num" id="stat-blocked">0</div><div class="s-label">Blocked</div></div>
      <div class="stat-card"><div class="s-num" id="stat-nav" style="color:var(--cyan)">0</div><div class="s-label">Navigations</div></div>
      <div class="stat-card"><div class="s-num" id="stat-rules" style="color:var(--gold)">0</div><div class="s-label">DNR Rules</div></div>
      <div class="section-title" style="margin-top:8px;">DNR Rules</div>
      <div class="rule-list" id="rule-list"><div style="font-size:12px;color:var(--muted);">Loading…</div></div>
      <div class="section-title" style="margin-top:8px;">Options</div>
      <div class="toggle-row">
        <span>Block ad networks</span>
        <label class="toggle"><input type="checkbox" id="tog-block" checked/><span class="slider"></span></label>
      </div>
    </div>
    <div class="main">
      <div class="filter-bar">
        <select id="filter-type">
          <option value="all">All events</option>
          <option value="blocked">Blocked only</option>
          <option value="beforenavigate">Navigation only</option>
        </select>
        <span style="font-size:12px;color:var(--muted);" id="event-count">0 events</span>
      </div>
      <div class="event-log" id="event-log"><div class="empty-state">Navigate to a page to see network events.</div></div>
    </div>
  </div>
  <script src="storage_manager.js"></script>
  <script src="network_monitor.js"></script>
</body>
</html>
