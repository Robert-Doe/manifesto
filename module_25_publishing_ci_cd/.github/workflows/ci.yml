name: NeuralTab CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest.json
        run: |
          node -e "
            const m = require('./manifest.json');
            if (m.manifest_version !== 3) { console.error('Must be MV3'); process.exit(1); }
            if (!m.version.match(/^\d+\.\d+\.\d+$/)) { console.error('Invalid version format'); process.exit(1); }
            console.log('manifest.json OK — v' + m.version);
          "

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Extension Package
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create extension zip
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          zip -r "neuraltab-v${VERSION}.zip" . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude "src/*" \
            --exclude "*.test.*" \
            --exclude "__tests__/*" \
            --exclude "*.md" \
            --exclude "*.sh" \
            --exclude ".github/*" \
            --exclude "*.map"
          echo "ZIP_NAME=neuraltab-v${VERSION}.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

  publish-to-cws:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Upload to CWS
        run: |
          # Upload new version
          UPLOAD_RESPONSE=$(curl -s -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CWS_EXTENSION_ID }}" \
            -H "Authorization: Bearer ${{ secrets.CWS_ACCESS_TOKEN }}" \
            -H "x-goog-api-version: 2" \
            -F "data=@$(ls neuraltab-*.zip)")
          echo "Upload: $UPLOAD_RESPONSE"

          # Publish
          PUBLISH_RESPONSE=$(curl -s -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CWS_EXTENSION_ID }}/publish" \
            -H "Authorization: Bearer ${{ secrets.CWS_ACCESS_TOKEN }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")
          echo "Publish: $PUBLISH_RESPONSE"
